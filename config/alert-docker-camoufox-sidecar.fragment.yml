# Fragment for alert-docker docker-compose.yml (copy camoufox-launcher + notification depends_on/env).
# Image tag must match alert_job_version (same as other rg.gdev.by/alert-job/* services).

  camoufox-launcher:
    image: rg.gdev.by/alert-job/camoufox-launcher:$alert_job_version
    ports:
      - "8888:8888"
    environment:
      CAMOUFOX_HTTP_BIND: "0.0.0.0"
      CAMOUFOX_WS_HOST: camoufox-launcher
      TZ: Europe/Moscow
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

