## PARAMETERS USED IN MULTIPLE SERVICES
profile=prod
#Application version
alert_job_version=1.0
#Application domain
domain=aj.gdev.by
## config parameters
encrypt_key= 
#Grafana server address
grafana_domain=grafana.gdev.by
#ACME email address
acme_email=grovedev.by@gmail.com
#Database directory
database_directory=/home/app/service/aj/files_prod/apps
#Used by default; after changing, other values may not work
#Keycloak admin password
keycloak_admin_password=admin
#Username with admin role on the Keycloak server
keycloak_admin=admin
#Repository containing project configuration files
local_config_directory=/home/app/service/aj/sources/alert-job-config-repo/
#Keycloak server URL
keycloak_url=https://aj.gdev.by/keycloak
#Path to local directory containing this file https://github.com/gdevby/alert-job/blob/main/parser-alert-job/src/main/resources/hubr.txt
parser_config_directory=/home/app/service/aj/config/parser
#Prometheus directory
prometheus_directory=/home/app/service/aj/config/prometheus
#Application logging level
logger_level=INFO
#Database access password
database_user_password=password_replace
#API key for Spring AI (LLM module)
AI_API_KEY=
#Base URL for Spring AI service. E.g. https://api.groq.com/openai
AI_BASE_URL=
#Spring AI model in use. E.g. llama-3.1-8b-instant
AI_MODEL=

## NOTIFICATION SERVICE PARAMETERS
#Mailbox connection configuration for receiving one-time user codes
#Mail server host for receiving one-time codes (e.g. webmail.gdev.by)
MAILBOX_HOST=
#Mailbox username for receiving one-time codes
MAILBOX_USERNAME=
#Mailbox password for receiving one-time codes
MAILBOX_PWD=
#Path to proxy file
PROXY_FILE=
#URL to refresh proxy list every 24 hours
PROXY_URL=
# Proxy source mode: URL or FILE
PARSER_PROXY_MODE=URL
#Telegram configuration
TELEGRAM_CHAT_TOKEN=
#Sender email address for outgoing messages
MAIL_FROM_ADDRESS=noreply@gdev.by
#SMTP username (sender address)
MAIL_SMTP_USERNAME=aj@gdev.by
MAIL_SMTP_PASSWORD=
MAIL_SMTP_HOST=smpt.gdev.by
MAIL_SMTP_PORT=587


